name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - Vue-FirebaseHosting
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # Vue.jsプロジェクトのディレクトリに移動して作業
    defaults:
      run:
        working-directory: ./vueFIrebaseHosting/src/view
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies and build
        run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OTAMESHI_EA83D }}
          channelId: live
          projectId: otameshi-ea83d
          # Firebase設定ファイルの場所を指定
          entryPoint: ./vueFIrebaseHosting/src/view
